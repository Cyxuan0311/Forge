---
name: Build & Test

"on":
  push:
    branches: [master, dev/**]
  pull_request:
    branches: [master, dev/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (CUDA ${{ matrix.cuda }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
        cuda: ['12.4.0']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.20
        with:
          cuda: ${{ matrix.cuda }}
          linux-local-args: '["--toolkit"]'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3-dev \
            python3-pip \
            libomp-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "numpy>=1.21.0" "pytest>=7.0" pytest-timeout

      - name: Verify environment
        run: |
          echo "OS: $(uname -a)"
          echo "CMake: $(cmake --version | head -1)"
          echo "CUDA: $(nvcc --version | tail -1)"
          echo "Python: $(python3 --version)"
          echo "GCC: $(gcc --version | head -1)"

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="86;89"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test CLI
        run: ./build/forge-cli --help

      - name: Run Python tests (no external model)
        run: |
          python -m pytest tests/ -v -k "not tinyllama" \
            --ignore=tests/test_tinyllama_integration.py \
            --ignore=tests/test_gguf_gpu.py \
            -x --timeout=120

      - name: Verify phimoe inference (CPU)
        # Runs the Phi-mini-MoE inference example end-to-end. Requires a model
        # path; set it as a repository variable PHIMOE_MODEL (e.g. a URL or a
        # downloaded .gguf) to enable. Skipped when not configured.
        if: vars.PHIMOE_MODEL != ''
        env:
          PHIMOE_MODEL: ${{ vars.PHIMOE_MODEL }}
        run: |
          bash examples/verify_inference.sh --cpu-only --prompt "hi" --max-new-tokens 32 phimoe

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-linux-cuda${{ matrix.cuda }}-py${{ matrix.python }}
          path: |
            build/forge-cli
            build/forge*.so
            build/*.a

  build-linux-no-cublas:
    name: Linux (CUDA ${{ matrix.cuda }}, no cuBLAS)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cuda: ['12.4.0']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.20
        with:
          cuda: ${{ matrix.cuda }}
          linux-local-args: '["--toolkit"]'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            python3-dev \
            python3-pip \
            libomp-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "numpy>=1.21.0" "pytest>=7.0" pytest-timeout

      - name: Configure CMake (no cuBLAS)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="86;89" \
            -DUSE_CUBLAS=OFF

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test CLI
        run: ./build/forge-cli --help

      - name: Run Python tests (no external model)
        run: |
          python -m pytest tests/ -v -k "not tinyllama" \
            --ignore=tests/test_tinyllama_integration.py \
            --ignore=tests/test_gguf_gpu.py \
            -x --timeout=120

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-linux-cuda${{ matrix.cuda }}-nocublas
          path: |
            build/forge-cli
            build/forge*.so
            build/*.a

  build-macos:
    name: macOS (CPU-only)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew update
          brew install cmake ninja libomp python@3.12

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "numpy>=1.21.0" "pytest>=7.0" pytest-timeout

      - name: Verify environment
        run: |
          echo "OS: $(uname -a)"
          echo "CMake: $(cmake --version | head -1)"
          echo "Python: $(python3 --version)"
          echo "CC: $(cc --version | head -1)"

      - name: Configure CMake (CPU-only)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.logicalcpu)"

      - name: Test CLI
        run: ./build/forge-cli --help

      - name: Run Python tests (CPU-only, no external model)
        run: |
          python -m pytest tests/ -v -k "not tinyllama and not gpu" \
            --ignore=tests/test_tinyllama_integration.py \
            --ignore=tests/test_gpu.py \
            --ignore=tests/test_gguf_gpu.py \
            -x --timeout=120

      - name: Verify inference (CPU-only)
        # End-to-end CPU inference smoke test. Gated on repository variable
        # VERIFY_MODEL (path to a GGUF model on the runner) to avoid CI cost
        # without explicit opt-in. macOS runners are arm64 (Apple Silicon).
        if: vars.VERIFY_MODEL != ''
        env:
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL }}
        run: |
          bash examples/verify_inference.sh --cpu-only --prompt "hi" \
            --max-new-tokens 16 "$VERIFY_MODEL"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-macos
          path: |
            build/forge-cli
            build/forge*.so
            build/*.a

  build-ppc64le:
    # GitHub has no native ppc64le runner, so the full project is
    # cross-compiled with the PPC64LE toolchain (auto-detects PPC64 -> VSX
    # kernels via cmake/detect_cpu_features.cmake) and the resulting binary
    # is smoke-tested under QEMU user-mode emulation.
    name: Linux PPC64LE (CPU-only, cross-compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-powerpc64le-linux-gnu \
            qemu-user-static \
            ninja-build

      - name: Verify environment
        run: |
          echo "OS: $(uname -a)"
          powerpc64le-linux-gnu-g++ --version | head -1
          qemu-ppc64le-static --version | head -1

      - name: Configure CMake (PPC64LE cross)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain_ppc64le.cmake \
            -DFORGE_USE_CUDA=OFF \
            -DFORGE_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Smoke-test CLI (QEMU)
        # qemu-ppc64le-static + -L point the dynamic loader at the
        # powerpc64le sysroot so the cross-built binary can actually run.
        run: |
          qemu-ppc64le-static -L /usr/powerpc64le-linux-gnu ./build/forge-cli --help

  build-windows:
    name: Windows (CPU-only)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "numpy>=1.21.0" "pytest>=7.0" pytest-timeout

      - name: Verify environment
        run: |
          echo "OS: $env:OS"
          cmake --version
          python --version

      - name: Configure CMake (CPU-only, MSVC)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j --config Release

      - name: Test CLI
        run: .\build\Release\forge-cli.exe --help
        shell: pwsh

      - name: Run Python tests (CPU-only, no external model)
        run: |
          $env:PYTHONPATH = "build;build\Release"
          python -m pytest tests/ -v -k "not tinyllama and not gpu" `
            --ignore=tests/test_tinyllama_integration.py `
            --ignore=tests/test_gpu.py `
            --ignore=tests/test_gguf_gpu.py `
            -x --timeout=120
