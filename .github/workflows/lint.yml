---
name: Lint

"on":
  push:
    branches: [master, dev/**]
  pull_request:
    branches: [master, dev/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-lint:
    name: CMake Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cmake-format
        run: pip install cmake-format

      - name: Check CMake formatting
        run: |
          # third_party/cutlass is a submodule: its CMake files are upstream's,
          # not ours to reformat.
          find . -name 'CMakeLists.txt' \
            -not -path './build/*' \
            -not -path './_deps/*' \
            -not -path './.cache/*' \
            -not -path './third_party/*' \
            -exec cmake-format --check {} +

  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/bindings/ tests/ benchmarks/ examples/ tools/

  python-types:
    name: Python Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        run: mypy --ignore-missing-imports src/bindings/ || true

  shellcheck:
    name: Shell Scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          find . -name '*.sh' -not -path './build/*' -not -path './_deps/*' \
            -exec shellcheck {} +

  kernel-manifest:
    name: Kernel Manifest Up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install PyYAML

      # kernel_manifest.yaml is the single source of truth for the GEMV
      # dispatch tables. Fail if the generated .cu has drifted from it --
      # the old generator silently pointed Q4_0 at a retired scalar kernel.
      - name: Check cuda_gemv_instances.cu matches kernel_manifest.yaml
        run: python tools/generate_gemv_instances.py --check

  yamllint:
    name: YAML Formatting (yamllint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .github/workflows/ .github/ISSUE_TEMPLATE/

  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check workflows
        uses: reviewdog/action-actionlint@v1
